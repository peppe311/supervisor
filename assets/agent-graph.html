        else if(detail.action==='start-agent'){window.CentralAgentSvelte.selectBoardProject(String(detail.nodeKey||''));send('project_board',{action:{type:'new_agent',node_key:detail.nodeKey,chat_id:null}});}
        else if(detail.action==='pin')send(source==='local'?'set_workspace_pinned':'set_remote_project_pinned',{...(source==='local'?{root:id}:{id}),pinned:!!detail.pinned});
        else if(detail.action==='remove')send(source==='local'?'eject_workspace':'remove_remote_project',source==='local'?{root:id,stop_active_runs:false}:{id});
        else if(detail.action==='terminal'||detail.action==='git')send('open_project_terminal',{source,id,git:detail.action==='git'});
        else if(detail.action==='folder')send('show_project_folder',{root:String(detail.root||'')});
        else if(detail.action==='refresh')send('refresh_project_metadata',{source,id});
        else if(detail.action==='reopen')send('set_reopen_last_project',{enabled:!!detail.enabled});
      });
      document.addEventListener('central-agent:project-board',event=>{
        const d=event.detail||{};
        if(d.action==='close')sendNonDraggingSurfaceChange('close_knowledge_graph');
        else if(d.action==='backend')send('project_board',{action:d.backendAction});
        else if(d.action==='select'){send('project_board',{action:{type:'select',source:d.source,id:d.id}});positionAgentConsole();}
        else if(d.action==='preview-chat')send('project_board',{action:{type:'preview_chat',chat_id:d.chatId}});
        else if(d.action==='close-chat-preview')send('project_board',{action:{type:'close_chat_preview',chat_id:d.chatId}});
        else if(d.action==='new-chat')send('project_board',{action:{type:'new_chat',root:d.root}});
        else if(d.action==='open-file')send('project_board',{action:{type:'open_file',root:d.root,path:d.path}});
        else if(d.action==='new-agent')send('project_board',{action:{type:'new_agent',node_key:d.nodeKey,chat_id:d.chatId||null}});
        else if(d.action==='link-chat')send('project_board',{action:{type:'link_chat',node_key:d.nodeKey,chat_id:d.chatId||null}});
        else if(d.action==='rename-agent')send('project_board',{action:{type:'rename_agent',node_key:d.nodeKey,name:d.name}});
        else if(d.action==='delete-agent')send('project_board',{action:{type:'delete_agent',node_key:d.nodeKey}});
        else if(d.action==='rename-chat')send('rename_project_chat',{chat_id:d.chatId,title:d.title});
        else if(d.action==='delete-chat')send('delete_project_chat',{chat_id:d.chatId});
        else if(d.action==='scope-changed')positionAgentConsole();
        else if(d.action==='open-agent')openCard(d.nodeKey);
        else if(d.action==='pin-chat')send('set_project_chat_pinned',{chat_id:d.chatId,pinned:!!d.pinned});
        else if(d.action==='refresh-files'){if(d.source==='local')send('refresh_workspace_explorer');else send('refresh_project_metadata',{source:d.source,id:d.id});}
        else if(d.action==='remote-file'||d.action==='terminal')send('open_project_terminal',{source:'ssh',id:d.id,git:false});
      });
      window.addEventListener('central-agent:project-board-open-agent',event=>openCard(event.detail?.nodeKey));
      window.addEventListener('central-agent:app-server-conversation',event=>updateSupervisedConversation(event.detail));
      window.addEventListener('central-agent:app-server-requests',event=>updateSupervisedConversation(event.detail));
      window.renderKnowledgeSurfaceState=window.renderAgentGraphState=(state={})=>{
        currentState=state;
        document.documentElement.dataset.theme=state.theme==='central_dark'?'central_dark':'central';
        body.classList.toggle('expanded',!!state.expanded);graphShell.hidden=!state.expanded;
        const orbView=state.orb||{size:112};orb.style.width=orbView.size+'px';orb.style.height=orbView.size+'px';orb.style.left='0px';orb.style.top='0px';
        releaseLogoAfterSurfaceReflow(false);
        const nodes=state.graph?.visualGraph?.nodes||[];
        graph.allNodeByKey=new Map(nodes.map(node=>[node.key||graphKey(node.recordType,node.recordId),node]));graph.nodeByKey=graph.allNodeByKey;
        queuedAgentRequest.hidden=!state.queuedAgentRequest;
        const runId=Number(state.discardableCheckpointRunId);discardFailedCheckpoint.hidden=!(Number.isSafeInteger(runId)&&runId>0);discardFailedCheckpoint.dataset.runId=String(runId||'');
        window.CentralAgentSvelte.updateProjectBoard(state);
        renderProjectChatConsoles(state);renderAgentConsole(state);positionAgentConsole();renderTimeMachine(state.timeMachine);
      };
      window.updateKnowledgeAgentMessage = window.updateAgentGraphMessage = (update = {}) => {
        const run = (currentState.knowledgeRuns || []).find(entry =>
          String(entry.nodeKey || "") === String(update.nodeKey || "") && Number(entry.agent?.runId) === Number(update.runId));
        if (!run || !Array.isArray(run.messages)) return;
        let message = run.messages.find(entry => String(entry.id) === String(update.id));
        if (!message) { message = {id:update.id,role:"assistant",runId:update.runId}; run.messages.push(message); }
        Object.assign(message, update);
        const card = [...document.querySelectorAll(".agent-console[data-node-key]")].find(element => element.dataset.nodeKey === String(run.nodeKey));
        const log = card?.querySelector('[data-timeline-scope="supervisor"] .agent-console-log') || card?.querySelector(".agent-console-log");
        if (!log) return;
        const stream = new CustomEvent("central-agent:graph-stream", {cancelable:true,detail:{owner:`graph:${run.nodeKey}`,message}});
        card.dispatchEvent(stream);
        if (!stream.defaultPrevented) renderConsoleHistory(log, run);
      };

      window.updateKnowledgeAgentReasoning = window.updateAgentGraphReasoning = (update = {}) => window.updateAgentGraphMessage({ ...update, kind: "reasoning" });
      window.updateProjectChatMessage = (update = {}) => {
        const previews = [projectChatPreview(update.chatId), ...(currentState.knowledgeRuns || []).map(run => run.supervisedChat).filter(preview => String(preview?.id || "") === String(update.chatId || ""))].filter(Boolean);
        if (!previews.length) return;
        let message = null;
        for (const preview of previews) {
          const messages = Array.isArray(preview.messages) ? preview.messages : (preview.messages = []);
          let row = messages.find(entry => String(entry.id) === String(update.id));
          if (!row) { row = {id:update.id,role:"assistant",runId:update.runId}; messages.push(row); }
          Object.assign(row, update); message ||= row;
        }
        const card = document.querySelector(`[data-project-chat-id="${CSS.escape(String(update.chatId || ""))}"]`);
        const stream = new CustomEvent("central-agent:graph-stream", {cancelable:true,detail:{owner:`chat:${update.chatId}`,message}});
        card?.dispatchEvent(stream);
        if (card && !stream.defaultPrevented) { const preview=previews[0]; renderConsoleHistory(card.querySelector(".agent-console-log"), {agent:preview.agent,messages:preview.messages,conversationState:preview.conversationState}); }
        for (const supervisorCard of document.querySelectorAll(".agent-console[data-node-key]")) supervisorCard.dispatchEvent(new CustomEvent("central-agent:graph-stream", {cancelable:true,detail:{owner:`chat:${update.chatId}`,message}}));
      };


      orb.addEventListener('dragstart',event=>event.preventDefault());
      orb.addEventListener("click", () => sendNonDraggingSurfaceChange("open_knowledge_graph"));
      document.getElementById('cancel-queued-agent-request').addEventListener('click',()=>send('cancel_pending_agent_submission'));
      discardFailedCheckpoint.addEventListener('click',()=>{const id=Number(discardFailedCheckpoint.dataset.runId);if(id>0&&window.confirm("Discard this failed checkpoint? Its baseline will be deleted and cannot be restored."))send('discard_failed_checkpoint',{run_id:id});});
      artifactViewerClose.addEventListener("click", closeAgentGraphArtifact);
      artifactViewer.addEventListener("click", (event) => { if (event.target === artifactViewer) closeAgentGraphArtifact(); });
      timeMachineClose.addEventListener("click", () => send("close_checkpoint"));
      timeMachineViewer.addEventListener("click", (event) => { if (event.target === timeMachineViewer) send("close_checkpoint"); });

      document.addEventListener('keydown',event=>{
        if(event.key!=='Escape'||event.defaultPrevented)return;
        if(!artifactViewer.hidden){event.preventDefault();closeAgentGraphArtifact();return;}
        if(!timeMachineViewer.hidden){event.preventDefault();send('close_checkpoint');}
      });
      new ResizeObserver(()=>positionAgentConsole()).observe(agentWindowLayer);
</script>
</body></html>
