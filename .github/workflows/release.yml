name: Source prerelease

on:
  push:
    tags: ['v*.*.*-alpha.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  draft:
    name: Draft experimental source release
    needs: verify
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and create source-only draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$') { throw 'Invalid prerelease tag' }
          ./scripts/verify-release-source.ps1
          gh release create $env:RELEASE_TAG --repo $env:REPOSITORY --verify-tag --draft --prerelease --title "Supervisor $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
